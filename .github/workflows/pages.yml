# Версия для iPhone (PWA): сайт https://bondrudes21.github.io/ishimura-mobile/
# Обновляется сама при каждом push в main, если изменились файлы сайта (не android/ и не .md).
# Источник Pages в настройках репозитория должен быть «GitHub Actions».
name: Сайт для iPhone

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: node scripts/precache.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
