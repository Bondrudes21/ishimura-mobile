<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https: http: data: blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https:; font-src 'self' data: blob:;" />
  <meta name="theme-color" content="#050a08" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ишимура" />
  <meta name="format-detection" content="telephone=no" />
  <title>Архив Ишимуры</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/effects.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/reader.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/library.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <style id="custom-fonts"></style>
  <style id="cursor-css"></style>
  <style id="user-css"></style>

  <script src="vendor/purify.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="fx-bg" aria-hidden="true"></div>

  <div id="app">
    <header class="titlebar">
      <button class="tb-btn tb-menu" id="nav-toggle" title="Меню"></button>
      <div class="brand">
        <span class="orb orb-sm"></span>
        <span class="brand-name">Архив <b>«Ишимуры»</b></span>
      </div>
      <div class="tb-drag"></div>
      <button class="tb-mode" id="mode-btn" title="Режим приложения"></button>
      <div class="tb-signal" id="signal" title="Связь с архивом"></div>
      <button class="tb-btn" id="qs-toggle" title="Быстрые настройки"></button>
      <div class="win-controls">
        <button class="tb-btn" data-win="minimize" title="Свернуть"></button>
        <button class="tb-btn" data-win="maximize" title="Развернуть"></button>
        <button class="tb-btn tb-close" data-win="close" title="Закрыть"></button>
      </div>
    </header>

    <div class="shell">
      <nav class="nav" id="nav"></nav>
      <main class="view" id="view"></main>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
  </div>

  <div id="fx-overlay" aria-hidden="true">
    <div class="fx-scan"></div>
    <div class="fx-grain"></div>
    <div class="fx-vignette"></div>
  </div>

  <div id="layers"></div>
  <div id="toasts"></div>
</body>
</html>
